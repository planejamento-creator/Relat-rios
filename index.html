<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Atividades Diárias - SEPLAG</title>
    <style>
        :root {
            --primary-color: #0b2545;
            --secondary-color: #134074;
            --accent-color: #8da9c4;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #0b2545;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(11, 37, 69, 0.1);
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .header {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 30px 20px;
            border-bottom: 4px solid var(--secondary-color);
        }

        .logo-container {
            background-color: white;
            display: inline-block;
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .logo-container img {
            height: 45px;
            display: block;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .header p {
            font-size: 0.8rem;
            color: var(--accent-color);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        form {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        input[type="text"],
        input[type="email"],
        input[type="date"],
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95krem;
            color: #334155;
            background-color: #f8fafc;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--secondary-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(19, 64, 116, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.3s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--secondary-color);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .footer-text {
            text-align: center;
            font-size: 0.7rem;
            color: #64748b;
            padding: 15px 20px;
            border-top: 1px solid #f1f5f9;
            background-color: #fafbfc;
        }

        /* Overlay de Carregamento e Sucesso */
        #loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 37, 69, 0.85);
            z-index: 999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            font-family: inherit;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: white;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loading-text {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo-container">
                <!-- Certifique-se de que o arquivo logo-mpma.png está na mesma pasta -->
                <img src="logo-mpma.png" alt="Logo MPMA">
            </div>
            <h1>Relatório de Atividades Diárias</h1>
            <p>Secretaria de Planejamento e Gestão - SEPLAG</p>
        </div>

        <form id="relatorioForm">
            <div class="form-group">
                <label for="nome">Nome do Servidor / Membro</label>
                <input type="text" id="nome" name="nome" placeholder="Digite o seu nome completo" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail Institucional</label>
                <input type="email" id="email" name="email" placeholder="nome@mpma.mp.br" required>
            </div>

            <div class="form-group">
                <label for="dataReferencia">Data de Referência</label>
                <input type="date" id="dataReferencia" name="dataReferencia" required>
            </div>

            <div class="form-group">
                <label for="entregas">Principais Entregas / Atividades Concluídas no Dia</label>
                <textarea id="entregas" name="entregas" placeholder="Descreva detalhadamente as entregas finalizadas..." required></textarea>
            </div>

            <div class="form-group">
                <label for="demandas">Demandas em Andamento</label>
                <textarea id="demandas" name="demandas" placeholder="Informe o estado das demandas correntes e prazos..."></textarea>
            </div>

            <div class="form-group">
                <label for="observacoes">Observações / Intempéries / Pendências</label>
                <textarea id="observacoes" name="observacoes" placeholder="Registros adicionais relevantes para o setor..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Enviar Relatório</button>
        </form>

        <div class="footer-text">
            Procuradoria Geral de Justiça do Estado do Maranhão - MPMA
        </div>
    </div>

    <!-- Tela de Carregamento / Sucesso -->
    <div id="loading-overlay">
        <div class="spinner" id="spinner-icon"></div>
        <div id="loading-text">Enviando relatório...</div>
    </div>

    <script>
        // SEU LINK DO GOOGLE APPS SCRIPT CONFIGURADO ABAIXO:
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw-fNdFNae9QXVlK2iX4FwXV7nRr33YnLQjzPMkosbd03zp-SebwNvcoWqcNDarFZY/exec';

        const form = document.getElementById('relatorioForm');
        const overlay = document.getElementById('loading-overlay');
        const spinner = document.getElementById('spinner-icon');
        const loadingText = document.getElementById('loading-text');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            // Exibe a tela de carregamento
            overlay.style.display = 'flex';
            spinner.style.display = 'block';
            loadingText.innerText = "Enviando relatório...";

            const formData = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                dataReferencia: document.getElementById('dataReferencia').value,
                entregas: document.getElementById('entregas').value,
                demandas: document.getElementById('demandas').value,
                observacoes: document.getElementById('observacoes').value
            };

            const startTime = Date.now();

            // Envio via fetch para o Google Apps Script
            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', // Necessário para requisições externas ao Google Apps Script
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(() => {
                // Como usamos 'no-cors', garantimos a simulação do tempo mínimo exigido de 5 segundos
                const elapsedTime = Date.now() - startTime;
                const remainingTime = Math.max(5000 - elapsedTime, 0);

                setTimeout(() => {
                    spinner.style.display = 'none';
                    loadingText.innerText = "Relatório enviado com sucesso!";
                    
                    setTimeout(() => {
                        overlay.style.display = 'none';
                        form.reset();
                    }, 2000); // Mantém a mensagem de sucesso por 2 segundos antes de sumir
                }, remainingTime);
            })
            .catch(error => {
                console.error('Erro:', error);
                spinner.style.display = 'none';
                loadingText.innerText = "Erro ao enviar. Tente novamente.";
                
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 3000);
            });
        });
    </script>
</body>
</html>
